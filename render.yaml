services:
  - type: web
    name: jarvis-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: USER_TIMEZONE
        value: Asia/Kolkata
      - key: OPENAI_API_KEY
        sync: false
